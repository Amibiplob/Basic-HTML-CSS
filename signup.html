<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Website - Sign Up</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>My Website</h1>

      <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="services.html">Services</a>
        <a href="gallery.html">Gallery</a>
        <a href="signup.html">Sign Up</a>
      </nav>
    </header>

    <main>
      <h2>Sign Up</h2>

      <form>
        <!-- Text -->
        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" />

        <!-- Email -->
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" />

        <!-- Password -->
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" />

        <!-- Number -->
        <label for="age">Age:</label>
        <input type="number" id="age" name="age" />

        <!-- Date -->
        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob" />

        <!-- Telephone -->
        <label for="phone">Phone:</label>
        <input type="tel" id="phone" name="phone" />

        <!-- URL -->
        <label for="website">Website:</label>
        <input type="url" id="website" name="website" />

        <!-- Select / Dropdown -->
        <label for="country">Country:</label>
        <select id="country" name="country">
          <option value="">Select Country</option>
          <option value="bangladesh">Bangladesh</option>
          <option value="india">India</option>
          <option value="usa">USA</option>
          <option value="uk">UK</option>
        </select>

        <!-- Radio buttons -->
        <p>Gender:</p>

        <input type="radio" id="male" name="gender" value="male" />
        <label class="inline" for="male">Male</label>

        <input type="radio" id="female" name="gender" value="female" />
        <label class="inline" for="female">Female</label>

        <!-- Checkbox -->
        <p>Interests:</p>

        <input type="checkbox" id="web" name="interest" value="web" />
        <label class="inline" for="web">Web Design</label>

        <input type="checkbox" id="photo" name="interest" value="photography" />
        <label class="inline" for="photo">Photography</label>

        <!-- File upload -->
        <label for="photoUpload">Upload Photo:</label>
        <input type="file" id="photoUpload" name="photo" />

        <!-- Textarea -->
        <label for="message">About Yourself:</label>
        <textarea id="message" name="message" rows="5"></textarea>

        <!-- Submit and Reset -->
        <input type="submit" value="Submit" />
        <input type="reset" value="Reset" />
      </form>
    </main>

    <footer>
      <p>&copy; MD Biplob Hosain</p>
      <p>&copy; ID :0272320005201022</p>
    </footer>
  </body>
</html>
